volumes:
  harpia-mysql-data:
    driver: local
  harpia-postgres-data:
    driver: local
  harpia-redis-data:
    driver: local
  caddy_network:
    external: true

networks:
  harpia-internal:
    driver: bridge
    internal: false   # permite saída para internet (necessário para integrações com webservices externos)
  harpia-db:
    driver: bridge
    internal: true    # rede isolada exclusiva para comunicação app <-> bancos

services:

  # ─── Banco de dados MySQL 8 ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: harpia-mysql
    restart: unless-stopped
    volumes:
      - harpia-mysql-data:/var/lib/mysql
    networks:
      - harpia-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-toor}
      MYSQL_DATABASE: ${DB_DATABASE:-harpia}
      MYSQL_USER: ${DB_USERNAME:-harpia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-harpia}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-toor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Porta NÃO exposta ao host por padrão (acesse via phpMyAdmin ou ferramenta interna)
    # Descomente abaixo apenas em desenvolvimento local se precisar de acesso direto:
    # ports:
    #   - "3307:3306"

  # ─── Banco de dados PostgreSQL 15 ────────────────────────────────────────
  pgsql:
    image: postgres:15-alpine
    container_name: harpia-postgres
    restart: unless-stopped
    volumes:
      - harpia-postgres-data:/var/lib/postgresql/data
    networks:
      - harpia-db
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-harpia}
      POSTGRES_USER: ${PGSQL_USERNAME:-harpia}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-harpia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USERNAME:-harpia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Porta NÃO exposta ao host por padrão
    # ports:
    #   - "5436:5432"

  # ─── Redis (sem porta exposta — acesso apenas interno) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: harpia-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-harpia_redis}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - harpia-redis-data:/data
    networks:
      - harpia-db
    # Porta deliberadamente NÃO exposta ao host (segurança)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-harpia_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── phpMyAdmin ──────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: harpia-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - harpia-db
      - harpia-internal
      - caddy_network
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Aplicação PHP 8.2 + Apache ──────────────────────────────────────────
  web:
    image: webdevops/php-apache:8.3
    container_name: harpia-web
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - harpia-internal   # acesso externo (webservices, APIs)
      - harpia-db         # acesso interno aos bancos e Redis
      - caddy_network
    environment:
      WEB_DOCUMENT_ROOT: /var/www/app/public
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 120
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 64M
      # Variáveis do Laravel — podem ser sobrescritas pelo .env
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-harpia}
      DB_USERNAME: ${DB_USERNAME:-harpia}
      DB_PASSWORD: ${DB_PASSWORD:-harpia}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-harpia_redis}
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Queue Worker (Laravel Queue via Redis) ───────────────────────────────
  queue:
    image: webdevops/php:8.3
    container_name: harpia-queue
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    networks:
      - harpia-internal
      - harpia-db
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-harpia}
      DB_USERNAME: ${DB_USERNAME:-harpia}
      DB_PASSWORD: ${DB_PASSWORD:-harpia}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-harpia_redis}